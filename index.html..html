<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLORES PROTEGIDAS</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --night: #05010a;
    --violet: #8a2be2;
    --stem: #107b17;
    --leaf: #0ca518;
    --leaf-2: #26b31f;
    --petal: #ffd60a;
    --petal-2: #ffe866;
    --core: #a45f07;
    --glow: #ffff00;
  }
  html { height: 100%; background: var(--night); scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; height: 100%; overflow: hidden; position: relative; }

  /* Aura morada que cubre la página */
  body::before {
    content: "";
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300vw; height: 170vh;
    background: radial-gradient(circle,
      rgba(138, 43, 226, 0.15) 0%,
      rgba(75, 0, 130, 0.1) 40%,
      rgba(0, 0, 0, 0) 70%);
    border-radius: 50%;
    z-index: -1;
    opacity: 0.7;
    animation: aura-expand 8s infinite ease-in-out;
    pointer-events: none;
  }
  @keyframes aura-expand {
    0%   { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
    50%  { transform: translate(-50%, -50%) scale(1.05); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.5; }
  }

  /* Partículas amarillas */
  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
  .particle {
    position: absolute; top: 0;
    width: 4px; height: 4px;
    background-color: #ffff00;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-100px) translateX(0); }
    100% { transform: translateY(100vh) translateX(30px); }
  }

  /* Escena de flores */
  #scene {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    height: min(78vh, 130vw);
    width: auto;
    aspect-ratio: 400 / 500;
    z-index: 5;
    overflow: visible;
  }
  .stem {
    fill: none; stroke: var(--stem); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    filter: drop-shadow(0 0 5px var(--stem));
    animation: grow 2.6s ease-out forwards;
  }
  @keyframes grow { to { stroke-dashoffset: 0; } }
  .leaf { animation: pop 1.2s ease-out both; }
  .leaf path { fill: var(--leaf); stroke: var(--leaf-2); stroke-width: 1.5; filter: drop-shadow(0 0 6px var(--leaf)); }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .head { animation: bloom 2s cubic-bezier(.2, .8, .2, 1) both; filter: drop-shadow(0 0 10px rgba(255, 235, 0, .75)); }
  @keyframes bloom {
    from { transform: scale(0) rotate(-50deg); }
    to   { transform: scale(1) rotate(0); }
  }
  .petal-a { fill: var(--petal); stroke: #e0a800; stroke-width: 1; }
  .petal-b { fill: var(--petal-2); }
  .core { fill: var(--core); }
  .core-2 { fill: #6b3a05; }
  .light {
    fill: var(--glow); opacity: 0;
    filter: drop-shadow(0 0 5px var(--glow));
    animation: float 4.5s ease-in-out infinite;
  }
  @keyframes float {
    0%   { opacity: 0; transform: translateY(0); }
    50%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-34px); }
  }
  .blade {
    fill: none; stroke-linecap: round; stroke-width: 4;
    animation: sway 4s ease-in-out infinite alternate, grow-up 2s ease-out both;
  }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @keyframes grow-up { from { opacity: 0; } to { opacity: 1; } }

  /* Aura amarilla que sube desde las flores */
  .flower-aura {
    position: fixed;
    left: 50%; bottom: -60vh;
    transform: translateX(-50%);
    width: 1200px; max-width: 160vw; height: 110vh;
    background: linear-gradient(to top,
      rgba(238, 246, 7, 0.55) 0%,
      rgba(211, 214, 12, 0.35) 30%,
      rgba(139, 157, 5, 0.15) 60%,
      transparent 90%);
    border-radius: 50% 50% 0 0;
    filter: blur(30px);
    z-index: 4;
    opacity: 0;
    transition: bottom 5s ease-out, opacity 2s ease-out;
    pointer-events: none;
  }
  .flower-aura.up { bottom: -20vh; opacity: 1; }

  /* Texto con efecto hacker */
  .aura-text {
    position: fixed;
    top: calc(2% + env(safe-area-inset-top, 0px));
    left: 50%; transform: translateX(-50%);
    font-family: 'Courier New', monospace;
    text-transform: uppercase; font-weight: bold; text-align: center;
    opacity: 0; z-index: 20; pointer-events: none;
    width: 100%; padding: 0 20px; box-sizing: border-box;
  }
  .aura-text span {
    display: inline-block;
    color: #8a2be2;
    text-shadow: 0 0 10px #8a2be2, 0 0 20px #8a2be2;
    font-size: clamp(20px, 6.4vw, 32px);
    opacity: 0; transform: translateY(20px);
    margin: 5px 0;
    transition: opacity .2s, transform .2s;
  }
  .aura-text span.cursor {
    width: 10px; height: 32px; opacity: 1; transform: none;
    background-color: #8a2be2; margin-left: 5px; padding: 0;
    text-shadow: none;
    animation: blink 0.7s infinite; vertical-align: middle;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .final-message {
    position: fixed;
    top: calc(2% + env(safe-area-inset-top, 0px));
    left: 50%; transform: translateX(-50%);
    font-family: 'Courier New', monospace;
    text-align: center;
    color: #8a2be2;
    text-shadow: 0 0 15px #8a2be2;
    opacity: 0; z-index: 30; pointer-events: none;
    font-size: clamp(20px, 6.4vw, 32px);
    line-height: 1.6; white-space: pre-line;
    max-width: 90%; width: 100%;
    padding: 0 20px; box-sizing: border-box;
  }
  .final-message.active {
    color: red;
    text-shadow: 0 0 20px red, 0 0 40px red, 0 0 80px red, 0 0 100px red;
    animation: text-pulse 0.5s infinite alternate;
  }
  @keyframes text-pulse {
    from { text-shadow: 0 0 30px yellow, 0 0 50px yellow; }
    to   { text-shadow: 0 0 40px yellow, 0 0 70px yellow, 0 0 100px yellow; }
  }

  body:not(.go) #scene * { animation-play-state: paused; }
  #entrada {
    position: fixed; inset: 0; z-index: 100;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(circle at 50% 55%, #1a0a2e 0%, var(--night) 70%);
    font-family: 'Courier New', monospace; text-align: center; cursor: pointer;
    padding: 0 24px; box-sizing: border-box;
  }
  #entrada.show { display: flex; }
  #entrada .titulo {
    font-size: clamp(24px, 7vw, 38px); font-weight: bold; color: var(--glow);
    text-shadow: 0 0 12px var(--glow), 0 0 28px var(--glow);
    animation: text-pulse 1s infinite alternate;
  }
  #entrada .sub { font-size: 15px; color: rgba(255, 255, 255, .7); }
  #entrada:focus-visible { outline: 3px solid var(--glow); outline-offset: -8px; }

  @media (prefers-reduced-motion: reduce) {
    .blade { animation: grow-up 1s both; }
    .light { animation-duration: 9s; }
  }
</style>
</head>
<body>
  <div class="aura-text" id="aura-text"></div>
  <div class="final-message" id="final-message"></div>
  <div class="particles" id="particles"></div>

<script>
(function () {
  /* ---------- Escena: flores amarillas, tallos verdes ---------- */
  var scene = document.getElementById('scene');
  var flowers = [
    { cx: 200, cy: 165, r: 56, stem: 'M200 505 C 188 420, 214 320, 200 165', d: 0.4,
      leaves: [[197, 410, -35, 1.2], [203, 350, -145, 1.1], [199, 285, -40, 0.9]] },
    { cx: 118, cy: 262, r: 42, stem: 'M132 505 C 142 430, 106 350, 118 262', d: 1.2,
      leaves: [[130, 440, -145, 1], [123, 370, -35, 0.9]] },
    { cx: 290, cy: 292, r: 38, stem: 'M272 505 C 262 440, 302 380, 290 292', d: 1.8,
      leaves: [[268, 455, -35, 1], [282, 385, -145, 0.9]] }
  ];
  var s = '';
  s += '<ellipse cx="200" cy="506" rx="270" ry="26" fill="#06210a"/>';

  flowers.forEach(function (f) {
    s += '<path class="stem" pathLength="1" d="' + f.stem + '" style="animation-delay:' + f.d + 's"/>';
  });
  flowers.forEach(function (f) {
    f.leaves.forEach(function (l, i) {
      s += '<g transform="translate(' + l[0] + ' ' + l[1] + ') rotate(' + l[2] + ') scale(' + l[3] + ')">' +
           '<g class="leaf" style="animation-delay:' + (f.d + 1.2 + i * 0.3) + 's">' +
           '<path d="M0 0 C 14 -11 32 -11 48 0 C 32 11 14 11 0 0 Z"/></g></g>';
    });
  });

  var n = 12, i, a;
  flowers.forEach(function (f) {
    var bd = f.d + 2.4;
    var r = f.r;
    s += '<g transform="translate(' + f.cx + ' ' + f.cy + ')"><g class="head" style="animation-delay:' + bd + 's">';
    for (i = 0; i < n; i++) {
      a = (360 / n) * i;
      s += '<ellipse class="petal-a" cx="0" cy="' + (-r * 0.62) + '" rx="' + (r * 0.21) + '" ry="' + (r * 0.5) +
           '" transform="rotate(' + a + ')"/>';
    }
    for (i = 0; i < n; i++) {
      a = (360 / n) * i + 180 / n;
      s += '<ellipse class="petal-b" cx="0" cy="' + (-r * 0.42) + '" rx="' + (r * 0.15) + '" ry="' + (r * 0.34) +
           '" transform="rotate(' + a + ')"/>';
    }
    s += '<circle class="core" r="' + (r * 0.3) + '"/><circle class="core-2" r="' + (r * 0.16) + '"/>';
    s += '</g></g>';

    var lights = f.r > 50 ? 9 : 6;
    for (i = 0; i < lights; i++) {
      var ang = Math.random() * Math.PI * 2;
      var dist = r * (0.9 + Math.random() * 1.1);
      var lx = f.cx + Math.cos(ang) * dist;
      var ly = f.cy + Math.sin(ang) * dist;
      s += '<circle class="light" cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="' +
           (1.6 + Math.random() * 1.6).toFixed(1) + '" style="animation-delay:' +
           (bd + 1 + Math.random() * 4).toFixed(2) + 's"/>';
    }
  });

  var greens = ['#0ca518', '#107b17', '#26b31f', '#0a6a12'];
  for (i = 0; i < 34; i++) {
    var x = 10 + Math.random() * 380;
    var h = 28 + Math.random() * 70;
    var dx = (Math.random() - 0.5) * 30;
    s += '<path class="blade" d="M' + x.toFixed(1) + ' 506 Q' + (x + dx * 0.3).toFixed(1) + ' ' + (506 - h * 0.55).toFixed(1) +
         ' ' + (x + dx).toFixed(1) + ' ' + (506 - h).toFixed(1) + '" stroke="' + greens[i % greens.length] +
         '" style="transform-origin:' + x.toFixed(1) + 'px 506px;animation-delay:' + (Math.random() * 2).toFixed(2) + 's,' +
         (2 + Math.random() * 2).toFixed(2) + 's"/>';
  }
  scene.innerHTML = s;

  /* ---------- Música e inicio ---------- */
  var song = document.getElementById('background-music');
  var entrada = document.getElementById('entrada');
  var started = false;

  function comenzar() {
    if (started) return;
    started = true;
    document.body.classList.add('go');
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) setTimeout(startParticles, 3000);
    setTimeout(startEffectsSequence, 8000);
  }

  function esperarToque() {
    entrada.classList.add('show');
    var eventos = ['pointerdown', 'touchend', 'click', 'keydown'];
    function alToque() {
      eventos.forEach(function (ev) { document.removeEventListener(ev, alToque); });
      try { var p = song.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
      entrada.classList.remove('show');
      comenzar();
    }
    eventos.forEach(function (ev) { document.addEventListener(ev, alToque); });
  }

  window.addEventListener('load', function () {
    var p;
    try { p = song.play(); } catch (err) { p = null; }
    if (p && p.then) {
      p.then(comenzar, esperarToque);   // si el navegador deja sonar sola, empieza directo
    } else {
      esperarToque();
    }
  });

  /* ---------- Partículas amarillas ---------- */
  var PARTICLE_INTENSITY = 50;
  var PARTICLE_SPAWN_RATE = 500;
  var PARTICLE_SPEED = 0.5;
  var WIND_INTENSITY = 20;
  var particleInterval;

  function startParticles() {
    var k;
    for (k = 0; k < PARTICLE_INTENSITY; k++) createParticle();
    var intensityIncreaseInterval = setInterval(function () {
      PARTICLE_INTENSITY += 20;
      PARTICLE_SPAWN_RATE = Math.max(40, PARTICLE_SPAWN_RATE - 30);
      for (var j = 0; j < 10; j++) createParticle();
      if (PARTICLE_INTENSITY > 400 && PARTICLE_SPAWN_RATE <= 50) {
        clearInterval(intensityIncreaseInterval);
        PARTICLE_INTENSITY = 600;
        PARTICLE_SPAWN_RATE = 40;
        clearInterval(particleInterval);
        particleInterval = setInterval(createParticle, PARTICLE_SPAWN_RATE);
      } else if (!particleInterval) {
        particleInterval = setInterval(createParticle, PARTICLE_SPAWN_RATE);
      }
    }, 1000);
  }

  function createParticle() {
    if (document.hidden) return;
    var particles = document.getElementById('particles');
    var particle = document.createElement('div');
    particle.className = 'particle';
    var size = Math.random() * 4 + 2;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';
    particle.style.opacity = Math.random() * 0.7 + 0.3;
    var duration = Math.random() * PARTICLE_SPEED + PARTICLE_SPEED;
    var delay = Math.random() * 2;
    particle.style.left = (Math.random() * 100) + 'vw';
    particle.style.animationDelay = delay + 's';
    particle.style.animationDuration = duration + 's';
    particles.appendChild(particle);
    setTimeout(function () { if (particle.parentNode) particle.remove(); }, (duration + delay) * 1000);
  }

  /* ---------- Aura y texto ---------- */
  function startEffectsSequence() {
    var aura = document.createElement('div');
    aura.className = 'flower-aura';
    document.body.appendChild(aura);
    setTimeout(function () { aura.classList.add('up'); }, 50);
    setTimeout(showHackerText, 2000);
    setTimeout(function () {
      aura.style.opacity = '0';
      setTimeout(function () { aura.remove(); }, 2200);
    }, 8000);
  }

  function showHackerText() {
    var message = 'Las flores que te mereces Yhoali❤️';
    var auraText = document.getElementById('aura-text');
    var finalMessage = document.getElementById('final-message');
    auraText.style.opacity = '1';

    var cursor = document.createElement('span');
    cursor.className = 'cursor';
    auraText.appendChild(cursor);

    var characters = Array.from(message);
    var idx = 0;
    var current = null;

    function next() {
      if (idx < characters.length) {
        if (idx === 0 || characters[idx - 1] === ' ') {
          current = document.createElement('span');
          auraText.insertBefore(current, cursor);
        }
        current.textContent += characters[idx];
        (function (el) {
          setTimeout(function () { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }, 50);
        })(current);
        idx++;
        setTimeout(next, 150);
      } else {
        cursor.remove();
        setTimeout(function () {
          auraText.style.transition = 'opacity 1s ease-out';
          auraText.style.opacity = '0';
          setTimeout(function () {
            finalMessage.textContent = message;
            finalMessage.style.transition = 'opacity 1s ease-in';
            finalMessage.style.opacity = '1';
            setTimeout(function () { finalMessage.classList.add('active'); }, 3000);
          }, 1000);
        }, 2000);
      }
    }
    next();
  }
})();
</script>
</body>
